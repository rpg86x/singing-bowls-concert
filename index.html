<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Singing Bowls Concert</title>
<link rel="icon" href="logo.png">
<style>
  :root {
    --bg1: #15110d; --bg2: #2a1f16; --text: #f3e9dc; --muted: #b9a892;
    --accent: #e2b66b; --panel: rgba(255, 240, 220, .06); --line: rgba(255, 240, 220, .14);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 35%, var(--bg2), var(--bg1) 70%);
    color: var(--text); font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; user-select: none;
  }
  header { position: relative; text-align: center; padding: 22px 16px 0; }
  #lang {
    position: absolute; right: 16px; top: 14px; z-index: 4;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  #lang option, #lang optgroup { background: var(--bg2); color: var(--text); }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  header h1 { margin: 0; font-weight: 300; letter-spacing: .3em; font-size: 15px; text-transform: uppercase; color: var(--muted); }
  #stage { position: relative; flex: 1; min-height: 260px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; touch-action: none; }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 30px; line-height: 1; cursor: pointer;
    display: grid; place-items: center; transition: background .2s, transform .15s;
  }
  .nav:hover { background: rgba(255, 240, 220, .14); }
  .nav:active { transform: translateY(-50%) scale(.92); }
  #prev { left: max(16px, 4vw); } #next { right: max(16px, 4vw); }
  #info { text-align: center; padding: 0 16px; }
  #name { font-size: 30px; font-weight: 300; margin: 0; }
  #meta { color: var(--accent); font-size: 14px; letter-spacing: .08em; margin-top: 4px; }
  #desc { color: var(--muted); font-size: 14px; max-width: 520px; margin: 8px auto 0; min-height: 2.6em; }
  #dots { display: flex; justify-content: center; gap: 8px; margin: 14px 0 4px; }
  #dots button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 0; background: var(--line); cursor: pointer; }
  #dots button.on { background: var(--accent); transform: scale(1.3); }
  #controls {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 22px;
    padding: 14px 16px 10px;
  }
  .btn {
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 9px 18px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .btn:hover { background: rgba(255, 240, 220, .14); }
  .btn.on { background: var(--accent); color: #23180c; border-color: var(--accent); }
  label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  input[type=range] { width: 110px; accent-color: var(--accent); }
  footer { display: flex; justify-content: space-between; gap: 12px; padding: 6px 16px 12px; font-size: 12px; color: var(--muted); opacity: .75; }
  #picker { display: none; text-align: center; padding: 0 16px; }
  body.concert #picker { display: block; }
  body.concert #info, body.concert .nav { display: none; }
  #pickTitle { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  #chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 920px; margin: 0 auto; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    padding: 5px 11px; border-radius: 999px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .chip.on { background: var(--accent); color: #23180c; border-color: var(--accent); }
  .chip:disabled { opacity: .35; cursor: default; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-family: inherit; }
  #start {
    position: absolute; inset: 0; z-index: 3; display: grid; place-items: center;
    background: rgba(10, 8, 6, .55); backdrop-filter: blur(3px); font-size: 17px; color: var(--text); cursor: pointer;
  }
  #start span { border: 1px solid var(--line); background: var(--panel); padding: 14px 26px; border-radius: 999px; }
  @media (max-width: 600px) {
    .nav { width: 46px; height: 46px; font-size: 24px; }
    #name { font-size: 24px; }
    footer .keys { display: none; }
  }
  /* Liedjes uit Song Library */
  #songBar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; padding: 8px 16px 0; }
  #songBar[hidden] { display: none; }
  #songSel { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 14px; max-width: 60vw; }
  #songSel option, #songSel optgroup { background: var(--bg2); }
  #songBar .btn.on { background: rgba(255, 77, 77, .25); border-color: #ff4d4d; color: var(--text); }
  #songStatus { min-width: 140px; font-size: 13px; color: var(--muted); text-align: center; }
  #songStatus.good { color: #8fd3b0; } #songStatus.bad { color: #ff7a7a; }
</style>
</head>
<body>
<header>
  <h1 data-t="app"></h1>
  <select id="lang" aria-label="Language">
    <option value="en">English</option>
    <option value="nl">Nederlands</option>
    <optgroup label="More languages">
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
    </optgroup>
  </select>
</header>

<div id="stage">
  <canvas id="cv"></canvas>
  <button class="nav" id="prev">‹</button>
  <button class="nav" id="next">›</button>
  <div id="start"><span data-t="start"></span></div>
</div>

<div id="info">
  <h2 id="name"></h2>
  <div id="meta"></div>
  <div id="desc"></div>
  <div id="dots"></div>
</div>

<div id="picker">
  <div id="pickTitle" data-t="pick"></div>
  <div id="chips"></div>
</div>

<div id="songBar" hidden>
  <select id="songSel"></select>
  <button class="btn" id="songListen"></button>
  <button class="btn" id="songPractice"></button>
  <button class="btn" id="songStop">■</button>
  <span id="songStatus"></span>
</div>

<div id="controls">
  <button class="btn" id="concert"><span data-t="concert"></span> <kbd>C</kbd></button>
  <button class="btn" id="strike"><span data-t="strike"></span> <kbd data-t="space"></kbd></button>
  <button class="btn" id="rub"><span data-t="rub"></span> <kbd>W</kbd></button>
  <button class="btn" id="hush"><span data-t="hush"></span> <kbd>S</kbd></button>
  <label><span data-t="volume"></span> <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></label>
  <label><span data-t="reverb"></span> <input type="range" id="verb" min="0" max="1" step="0.01" value="0.45"></label>
</div>

<footer>
  <span class="keys" data-t="keys"></span>
  <span><a href="https://urbantechmonk.gumroad.com/coffee" target="_blank" rel="noopener" data-t="donate"></a> · <span data-t="app"></span> 1.1</span>
</footer>

<script src="songs.js"></script>

// ---------- Voorkeuren ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('sbconcert.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sbconcert.' + k, JSON.stringify(v)); } catch {} },
};

// ---------- Audio ----------
let ctx, bus, master, wet, noiseBuf;
const voices = [];          // aangeslagen klanken, oudste eerst
const rubs = new Map();     // zingende schalen: index → wrijfklank (in een concert meerdere tegelijk)

function initAudio() {
  if (ctx) return;
  ctx = new AudioContext();
  master = ctx.createGain();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -10; comp.ratio.value = 4;
  master.connect(comp).connect(ctx.destination);
  bus = ctx.createGain();
  const dry = ctx.createGain(); dry.gain.value = .8;
  bus.connect(dry).connect(master);
  const conv = ctx.createConvolver(); conv.buffer = impulse(4.5);
  wet = ctx.createGain();
  bus.connect(conv).connect(wet).connect(master);
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  applyMix();
}

// Synthetische zaalgalm: stereo ruis die exponentieel uitsterft
function impulse(sec) {
  const len = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
  }
  return buf;
}

function applyMix() {
  if (!ctx) return;
  master.gain.setTargetAtTime(+vol.value * .9, ctx.currentTime, .05);
  wet.gain.setTargetAtTime(+verb.value * 1.1, ctx.currentTime, .05);
}

// Twee licht verstemde sinussen per boventoon geven de typische zweving van een schaal
function partialPair(b, ratio, amp, out, nodes) {
  const f = b.f * ratio, spread = b.beat * Math.sqrt(ratio) / 2;
  for (const d of [-spread, spread]) {
    if (f + d > ctx.sampleRate / 2.2) continue;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = f + d; g.gain.value = amp / 2;
    o.connect(g).connect(out); o.start(); nodes.push(o);
  }
}

function strike(i, brightness = .6, force = 1) {
  if (typeof songHit === 'function') songHit(i);
  initAudio();
  const b = BOWLS[i], t = ctx.currentTime, nodes = [];
  const out = ctx.createGain(); out.connect(bus);
  b.partials.forEach(([ratio, amp, df], k) => {
    const env = ctx.createGain(), a = amp * force * .32 * (k ? .35 + brightness * 1.3 : 1);
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(a, t + .004 + k * .002);
    env.gain.setTargetAtTime(0, t + .01, (b.decay * df) / 5);
    env.connect(out);
    partialPair(b, ratio, 1, env, nodes);
  });
  // Tik van de klopper
  const n = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain();
  n.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = 1800 + brightness * 3000; bp.Q.value = 1.2;
  ng.gain.setValueAtTime(.12 * force * (.4 + brightness), t); ng.gain.exponentialRampToValueAtTime(.0001, t + .05);
  n.connect(bp).connect(ng).connect(out); n.start(t); n.stop(t + .06);
  const end = t + b.decay * 1.1;
  nodes.forEach(o => o.stop(end));
  voices.push({ out, nodes, end });
  // Maximaal 8 klanken tegelijk (16 in een concert): de oudste vervaagt snel
  while (voices.length > (concert ? 16 : 8)) fadeVoice(voices.shift(), .4);
  energy[i] = Math.min(1.25, energy[i] + force * .9);
}

function fadeVoice(v, tc) {
  const t = ctx.currentTime;
  v.out.gain.cancelScheduledValues(t);
  v.out.gain.setTargetAtTime(0, t, tc);
  v.nodes.forEach(o => { try { o.stop(t + tc * 6); } catch {} });
}

// manual: zelf roeren met vinger of muis; het volume volgt dan de snelheid van de cirkels van die vinger (zie frame)
function startRub(i, manual = false, drag = null) {
  initAudio();
  stopRub(i);
  const b = BOWLS[i], t = ctx.currentTime, nodes = [];
  const g = ctx.createGain(); g.gain.setValueAtTime(0, t);
  if (!manual) g.gain.setTargetAtTime(.3, t, 1.8);
  // De stok rond de rand laat het volume zachtjes op en neer gaan
  const am = ctx.createGain(); am.gain.value = .8;
  const lfo = ctx.createOscillator(), lfoG = ctx.createGain();
  lfo.frequency.value = .7; lfoG.gain.value = manual ? .06 : .2; lfo.connect(lfoG).connect(am.gain); lfo.start(); nodes.push(lfo);
  am.connect(g).connect(bus);
  const mix = b.crystal ? [[0, 1], [1, .08]] : [[0, 1], [1, .3], [2, .06]];
  mix.forEach(([k, a]) => partialPair(b, b.partials[k][0], a, am, nodes));
  // Zacht schuren van hout op metaal
  const n = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain();
  n.buffer = noiseBuf; n.loop = true; bp.type = 'bandpass'; bp.frequency.value = b.f * 2; bp.Q.value = 3; ng.gain.value = manual ? 0 : .025;
  n.connect(bp).connect(ng).connect(am); n.start(); nodes.push(n);
  const r = { i, g, ng, nodes, manual, drag, level: 0, ang: 0 };
  rubs.set(i, r);
  updateRubBtn();
  return r;
}

function stopRub(i) {
  const r = rubs.get(i);
  if (!r) return;
  const b = BOWLS[i], t = ctx.currentTime;
  r.g.gain.cancelScheduledValues(t);
  r.g.gain.setValueAtTime(r.g.gain.value, t);
  r.g.gain.setTargetAtTime(0, t, b.decay / 8);
  r.nodes.forEach(o => o.stop(t + b.decay));
  rubs.delete(i);
  updateRubBtn();
}
function stopAllRubs() { [...rubs.keys()].forEach(stopRub); }
const autoRubbing = () => [...rubs.values()].some(r => !r.manual);
function updateRubBtn() { rubBtn.classList.toggle('on', autoRubbing()); }

// De schalen die nu bespeeld worden: in een concert alle gekozen, anders de huidige
const playing = () => concert ? concertSel : [current()];

// W of de knop: laat alle bespeelde schalen vanzelf zingen; zingen ze al allemaal, dan stopt het
function toggleSing() {
  unlock();
  const list = playing(), singing = (i) => rubs.has(i) && !rubs.get(i).manual;
  if (list.length && list.every(singing)) list.forEach(stopRub);
  else list.filter(i => !rubs.has(i)).forEach(i => startRub(i));   // een schaal die je zelf roert laten we met rust
}
function strikeAll() {
  unlock();
  // Alles tegelijk aanslaan telt niet als noot bij het oefenen
  const p = songState.mode;
  songState.mode = 'idle';
  playing().forEach(i => strike(i, .6, concert ? .8 : 1));
  songState.mode = p;
}

function hush() {
  if (!ctx) return;
  stopAllRubs();
  while (voices.length) fadeVoice(voices.shift(), .6);
  for (let k = 0; k < energy.length; k++) energy[k] = Math.min(energy[k], .3);
}

// ---------- Navigatie ----------
const N = BOWLS.length;
const mod = (k) => ((k % N) + N) % N;
let target = Math.max(0, BOWLS.findIndex(b => b.id === store.get('bowl', ''))); // onbegrensde index, zodat de carrousel rond kan draaien
let pos = target;
const energy = new Array(N).fill(0);

function go(step) {
  stopAllRubs();
  target += step;
  showInfo();
}
function jump(i) {
  const d = mod(i - target);
  go(d > N / 2 ? d - N : d);
}
function current() { return mod(target); }

function showInfo() {
  const i = current(), b = BOWLS[i], t = LANGS[lang];
  nameEl.textContent = t.type[b.type];
  metaEl.textContent = `${b.note} · ${b.f.toFixed(1)} Hz · ${t.chakra[b.chakra]}`;
  descEl.textContent = t.desc[b.id];
  [...dotsEl.children].forEach((d, k) => d.classList.toggle('on', k === i));
  store.set('bowl', b.id);
}

// Eerste keer: taal van de browser als we die hebben, anders Engels
let lang = store.get('lang', null);
if (!LANGS[lang]) lang = (navigator.languages || [navigator.language]).map(l => (l || '').slice(0, 2)).find(l => LANGS[l]) || 'en';

function applyLang() {
  const t = LANGS[lang];
  document.documentElement.lang = lang;
  document.title = t.app;
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = (concert && CONCERT_TEXT[el.dataset.t]) || el.dataset.t;
    if (key.endsWith('keys')) el.innerHTML = t[key]; else el.textContent = t[key];
  });
  concertBtn.classList.toggle('on', concert);
  renderChips();
  songLabels();
  document.getElementById('prev').title = t.prev;
  document.getElementById('next').title = t.next;
  document.querySelector('#lang optgroup').label = t.more;
  [...dotsEl.children].forEach((d, k) => { d.title = `${k + 1}. ${t.type[BOWLS[k].type]} (${BOWLS[k].note})`; });
  langEl.value = lang;
  showInfo();
}

// ---------- Tekenen ----------
const cv = document.getElementById('cv'), g2 = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let layouts = [];   // bespeelbare schalen op het scherm: { i, cx, cy, R, depth }

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
}

// ang: hoek van de stok op de rand, of null als de schaal niet gewreven wordt
function drawBowl(b, cx, cy, R, e, time, alpha, ang) {
  const ry = R * .27, depth = R * b.depth;
  g2.save();
  g2.globalAlpha = alpha;
  cx += Math.sin(time * 70) * e * .8;

  // Gloed
  if (e > .01) {
    const gl = g2.createRadialGradient(cx, cy + depth * .3, R * .2, cx, cy + depth * .3, R * 2);
    gl.addColorStop(0, `rgba(255,210,140,${.22 * Math.min(1, e)})`); gl.addColorStop(1, 'rgba(255,210,140,0)');
    g2.fillStyle = gl; g2.fillRect(cx - R * 2.2, cy - R * 2, R * 4.4, R * 4.4);
  }
  // Schaduw en kussen
  const by = cy + depth;
  g2.fillStyle = 'rgba(0,0,0,.45)';
  g2.beginPath(); g2.ellipse(cx, by + R * .2, R * .95, R * .16, 0, 0, Math.PI * 2); g2.fill();
  const cg = g2.createRadialGradient(cx - R * .2, by - R * .05, R * .1, cx, by + R * .05, R * .8);
  cg.addColorStop(0, shade(b.cushion, 1.35)); cg.addColorStop(1, shade(b.cushion, .55));
  g2.fillStyle = cg;
  g2.beginPath(); g2.ellipse(cx, by + R * .06, R * .78, R * .2, 0, 0, Math.PI * 2); g2.fill();

  // Stok achter de schaal
  if (ang !== null && Math.sin(ang) < 0) drawStick(cx, cy, R, ry, ang);

  // Lichaam
  const bg = g2.createLinearGradient(cx - R, 0, cx + R, 0);
  bg.addColorStop(0, b.metal[0]); bg.addColorStop(.3, b.metal[2]); bg.addColorStop(.5, b.metal[1]);
  bg.addColorStop(.85, b.metal[0]); bg.addColorStop(1, shade(b.metal[0], .7));
  g2.fillStyle = bg;
  g2.beginPath();
  g2.moveTo(cx - R, cy);
  g2.bezierCurveTo(cx - R, cy + depth * .7, cx - R * .55, cy + depth, cx, cy + depth);
  g2.bezierCurveTo(cx + R * .55, cy + depth, cx + R, cy + depth * .7, cx + R, cy);
  g2.ellipse(cx, cy, R, ry, 0, 0, Math.PI, true);
  g2.fill();
  // Gegraveerde banden
  if (!b.crystal) {
    g2.strokeStyle = 'rgba(0,0,0,.28)'; g2.lineWidth = Math.max(1, R * .012);
    for (const k of [.16, .22]) {
      const w = R * (1 - k * k * .9);
      g2.beginPath(); g2.ellipse(cx, cy + depth * k, w, ry * .95, 0, 0, Math.PI); g2.stroke();
    }
  }
  // Binnenkant met trillend oppervlak
  const ig = g2.createRadialGradient(cx, cy + ry * .3, R * .1, cx, cy, R);
  ig.addColorStop(0, b.crystal ? shade(b.metal[1], .93) : shade(b.metal[0], .6));
  ig.addColorStop(.75, b.crystal ? shade(b.metal[2], .96) : b.metal[1]);
  ig.addColorStop(1, b.metal[2]);
  g2.fillStyle = ig;
  g2.beginPath(); g2.ellipse(cx, cy, R * .96, ry * .92, 0, 0, Math.PI * 2); g2.fill();
  if (e > .01) {
    g2.save();
    g2.beginPath(); g2.ellipse(cx, cy, R * .94, ry * .9, 0, 0, Math.PI * 2); g2.clip();
    const rings = 5;
    for (let k = 0; k < rings; k++) {
      const p = (time * .45 + k / rings) % 1;
      g2.strokeStyle = b.crystal ? `rgba(150,170,200,${(1 - p) * Math.min(1, e) * .7})` : `rgba(255,235,190,${(1 - p) * Math.min(1, e) * .55})`;
      g2.lineWidth = Math.max(1, R * .012);
      g2.beginPath(); g2.ellipse(cx, cy, R * .94 * p, ry * .9 * p, 0, 0, Math.PI * 2); g2.stroke();
    }
    g2.restore();
  }
  // Rand
  g2.strokeStyle = b.metal[2]; g2.lineWidth = Math.max(1.5, R * .025);
  g2.beginPath(); g2.ellipse(cx, cy, R * .98, ry * .96, 0, 0, Math.PI * 2); g2.stroke();
  g2.strokeStyle = 'rgba(255,255,255,.35)'; g2.lineWidth = 1;
  g2.beginPath(); g2.ellipse(cx, cy, R * .98, ry * .96, 0, Math.PI * 1.05, Math.PI * 1.6); g2.stroke();

  if (ang !== null && Math.sin(ang) >= 0) drawStick(cx, cy, R, ry, ang);
  g2.restore();
}

function drawStick(cx, cy, R, ry, ang) {
  const x = cx + Math.cos(ang) * R, y = cy + Math.sin(ang) * ry;
  const len = R * .85, a = -Math.PI / 2 + Math.cos(ang) * .5;
  const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
  g2.lineCap = 'round';
  g2.strokeStyle = '#3d2714'; g2.lineWidth = R * .09;
  g2.beginPath(); g2.moveTo(x, y); g2.lineTo(x2, y2); g2.stroke();
  g2.strokeStyle = '#8a5a2f'; g2.lineWidth = R * .06;
  g2.beginPath(); g2.moveTo(x, y); g2.lineTo(x2, y2); g2.stroke();
}

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v * f))));
  return `rgb(${c})`;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  const time = now / 1000;
  pos += (target - pos) * Math.min(1, dt * 7);
  if (Math.abs(target - pos) < .001) pos = target;
  // Zelf roeren: rond 1 rondje per seconde zingt de schaal vol; ze bouwt langzaam op en zakt weg als je stilhoudt
  for (const r of rubs.values()) {
    if (!r.manual) continue;
    const d = r.drag;
    if (now - d.lastMove > 60) d.speed *= Math.exp(-dt * 5);
    const want = Math.min(1.3, d.speed / (ROUND * .9));
    r.level += (want - r.level) * Math.min(1, dt * (want > r.level ? .9 : 2.5));
    const t = ctx.currentTime;
    r.g.gain.setTargetAtTime(r.level * .32, t, .08);
    r.ng.gain.setTargetAtTime(Math.min(1, want) * .035, t, .05);
  }
  for (let k = 0; k < N; k++) {
    const r = rubs.get(k);
    if (r) {
      const goal = r.manual ? r.level * .9 : .75;
      energy[k] += (goal - energy[k]) * Math.min(1, dt * (r.manual ? 2 : .6));
    } else energy[k] *= Math.exp(-dt / (BOWLS[k].decay / 4));
  }

  g2.setTransform(DPR, 0, 0, DPR, 0, 0);
  g2.clearRect(0, 0, W, H);
  layouts = [];
  if (concert) drawConcert(time); else drawCarousel(time);
  requestAnimationFrame(frame);
}

// Stok van een zingende schaal: volgt de vinger, of draait vanzelf (elke schaal in een eigen fase)
function stickFor(i, time) {
  const r = rubs.get(i);
  return !r ? null : r.manual ? r.ang : time * ROUND * .7 + i * 1.3;
}

// Concert: de gekozen schalen naast elkaar, bij meer dan 4 in twee rijen
function drawConcert(time) {
  const n = concertSel.length;
  if (!n) return;
  const rows = n <= 4 ? 1 : 2, cols = Math.ceil(n / rows);
  const cw = W / cols, ch = H / rows;
  g2.font = `${Math.round(Math.max(11, Math.min(14, ch * .05)))}px "Segoe UI", system-ui, sans-serif`;
  g2.textAlign = 'center';
  concertSel.forEach((i, s) => {
    const b = BOWLS[i], row = Math.floor(s / cols), col = s % cols;
    const inRow = row === rows - 1 ? n - cols * (rows - 1) : cols;
    const cx = (col + .5 + (cols - inRow) / 2) * cw;
    const R = Math.min(cw * .36, ch * .36) * (.8 + .2 * b.size);
    const cy = row * ch + ch * .3;
    drawBowl(b, cx, cy, R, energy[i], time, 1, stickFor(i, time));
    layouts.push({ i, cx, cy, R, depth: R * b.depth });
    if (i === songTarget || i === songNext) {
      g2.save();
      g2.strokeStyle = i === songTarget ? `rgba(255,70,70,${.75 + Math.sin(time * 6) * .25})` : 'rgba(255,140,120,.8)';
      g2.lineWidth = Math.max(3, R * (i === songTarget ? .07 : .035));
      if (i !== songTarget) g2.setLineDash([R * .12, R * .08]);
      g2.beginPath(); g2.ellipse(cx, cy + R * b.depth * .35, R * 1.18, R * (.3 + b.depth * .55), 0, 0, Math.PI * 2); g2.stroke();
      g2.restore();
    }
    g2.fillStyle = 'rgba(243,233,220,.7)';
    g2.fillText(`${s + 1} · ${b.note}`, cx, cy + R * b.depth + R * .45);
  });
}

function drawCarousel(time) {
  const base = Math.min(W * .26, H * .42), spacing = Math.max(base * 2.6, W * .36);
  const cy = H * .42;
  const order = [];
  for (let k = Math.round(pos) - 2; k <= Math.round(pos) + 2; k++) order.push(k);
  order.sort((a, b) => Math.abs(b - pos) - Math.abs(a - pos)); // dichtstbijzijnde als laatste
  for (const k of order) {
    const d = k - pos, ad = Math.abs(d);
    if (ad > 2.2) continue;
    const i = mod(k), b = BOWLS[i];
    const scale = 1 - Math.min(ad, 1.5) * .38;
    const R = base * b.size * scale;
    const cx = W / 2 + d * spacing;
    const alpha = Math.max(0, 1 - ad * .62);
    drawBowl(b, cx, cy - R * .2, R, energy[i], time, alpha, stickFor(i, time));
    if (ad < .5) layouts.push({ i, cx, cy: cy - R * .2, R, depth: R * b.depth });
  }
}

// ---------- Bediening ----------
const nameEl = document.getElementById('name'), metaEl = document.getElementById('meta');
const descEl = document.getElementById('desc'), dotsEl = document.getElementById('dots');
const vol = document.getElementById('vol'), verb = document.getElementById('verb');
const rubBtn = document.getElementById('rub'), startEl = document.getElementById('start');

const langEl = document.getElementById('lang');
const concertBtn = document.getElementById('concert'), chipsEl = document.getElementById('chips');

// Concert: tot 8 gekozen schalen tegelijk op het scherm. De app start in de stand van de vorige keer.
const MAX_CONCERT = 8;
const CONCERT_TEXT = { strike: 'strikeAll', rub: 'singAll', keys: 'ckeys' };
let concert = store.get('mode', 'concert') === 'concert';
let concertSel = store.get('concert', ['c3', 'e3', 'g3', 'crystal', 'rin'])
  .map(id => BOWLS.findIndex(b => b.id === id)).filter(i => i >= 0).slice(0, MAX_CONCERT);
document.body.classList.toggle('concert', concert);
BOWLS.forEach((b, k) => {
  const d = document.createElement('button');
  d.onclick = () => jump(k);
  dotsEl.appendChild(d);
});
langEl.onchange = () => { lang = langEl.value; store.set('lang', lang); applyLang(); langEl.blur(); };
vol.value = store.get('vol', .8); verb.value = store.get('verb', .45);
vol.oninput = () => { applyMix(); store.set('vol', +vol.value); };
verb.oninput = () => { applyMix(); store.set('verb', +verb.value); };

function unlock() {
  initAudio();
  if (ctx.state === 'suspended') ctx.resume();
  startEl.remove();
}
startEl.onclick = unlock;

document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('strike').onclick = strikeAll;
rubBtn.onclick = toggleSing;
document.getElementById('hush').onclick = hush;
concertBtn.onclick = toggleConcert;

// ---------- Concert ----------
function toggleConcert() {
  stopAllRubs();
  concert = !concert;
  document.body.classList.toggle('concert', concert);
  store.set('mode', concert ? 'concert' : 'single');
  applyLang();
}

function renderChips() {
  const t = LANGS[lang];
  chipsEl.innerHTML = '';
  BOWLS.forEach((b, i) => {
    const on = concertSel.includes(i), c = document.createElement('button');
    c.className = 'chip' + (on ? ' on' : '');
    c.disabled = !on && concertSel.length >= MAX_CONCERT;
    c.textContent = `${b.note} · ${t.type[b.type]}`;
    c.onclick = () => {
      if (on) { stopRub(i); concertSel = concertSel.filter(k => k !== i); }
      else concertSel = [...concertSel, i].sort((x, y) => x - y);   // van laag naar hoog, zodat 1 links staat
      store.set('concert', concertSel.map(k => BOWLS[k].id));
      renderChips();
    };
    chipsEl.appendChild(c);
  });
}

// Tik op een schaal = aanslaan (hoe dichter bij de rand, hoe helderder).
// Cirkels om een schaal trekken = zelf roeren; na ruim een kwart rondje begint ze te zingen.
// Elke vinger heeft zijn eigen schaal, dus met meerdere vingers bespeel je meerdere schalen tegelijk.
const drags = new Map();   // pointerId → beweging van die vinger of muis
const ROUND = Math.PI * 2;

function pointerAt(ev) {
  const r = cv.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}
// Hoek rond het midden van de schaal; y iets uitgerekt zodat een ronde handbeweging gelijkmatig telt
function angleAt(p, L) {
  const dx = p.x - L.cx, dy = (p.y - (L.cy + L.depth * .35)) / .7;
  return Math.hypot(dx, dy) < L.R * .15 ? null : Math.atan2(dy, dx);
}
// Dichtstbijzijnde schaal; in een concert alleen als je er echt bij in de buurt bent
function hitBowl(p) {
  let best = null, bd = Infinity;
  for (const L of layouts) {
    const d = Math.hypot(p.x - L.cx, (p.y - (L.cy + L.depth * .35)) / .7) / L.R;
    if (d < bd) { bd = d; best = L; }
  }
  return best && (!concert || bd < 1.7) ? best : null;
}
const layoutOf = (i) => layouts.find(L => L.i === i);

cv.addEventListener('pointerdown', (ev) => {
  unlock();
  const p = pointerAt(ev), L = hitBowl(p);
  if (!L) return;
  try { cv.setPointerCapture(ev.pointerId); } catch {}
  const now = performance.now();
  drags.set(ev.pointerId, { i: L.i, start: p, t0: now, moved: 0, last: p, lastA: angleAt(p, L), lastT: now, turned: 0, speed: 0, lastMove: 0 });
});

cv.addEventListener('pointermove', (ev) => {
  const drag = drags.get(ev.pointerId), L = drag && layoutOf(drag.i);
  if (!L) return;
  const p = pointerAt(ev), now = performance.now();
  drag.moved += Math.hypot(p.x - drag.last.x, p.y - drag.last.y);
  drag.last = p;
  const a = angleAt(p, L);
  if (a === null || drag.lastA === null) { drag.lastA = a; drag.lastT = now; return; }
  let d = a - drag.lastA;
  if (d > Math.PI) d -= ROUND; else if (d < -Math.PI) d += ROUND;
  const dt = Math.max(.008, (now - drag.lastT) / 1000);
  drag.speed += (Math.abs(d) / dt - drag.speed) * .25;   // rad/s, afgevlakt
  drag.turned += Math.abs(d);
  drag.lastA = a; drag.lastT = now; drag.lastMove = now;
  let r = rubs.get(drag.i);
  if (drag.turned > 1.7 && !(r && r.drag === drag)) r = startRub(drag.i, true, drag);
  if (r && r.drag === drag) r.ang = a;
});

function endDrag(ev) {
  const drag = drags.get(ev.pointerId);
  if (!drag) return;
  drags.delete(ev.pointerId);
  const r = rubs.get(drag.i), L = layoutOf(drag.i);
  if (r && r.drag === drag) stopRub(drag.i);
  else if (L && drag.moved < 10 && performance.now() - drag.t0 < 400) {
    const { x, y } = drag.start, { cx, cy, R, depth } = L;
    if (x > cx - R * 1.1 && x < cx + R * 1.1 && y > cy - R * .4 && y < cy + depth * 1.15) {
      strike(drag.i, .2 + Math.min(1, Math.abs(x - cx) / R) * .8);
    }
  }
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

let digits = '', digitTimer = 0;
function typeDigit(k) {
  clearTimeout(digitTimer);
  digits += k;
  const n = +digits;
  if (n >= 1 && n <= N) jump(n - 1);
  if (n === 0 || n * 10 > N) digits = '';
  else digitTimer = setTimeout(() => { digits = ''; }, 800);
}

document.addEventListener('keydown', (ev) => {
  if ((ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') && ev.key.startsWith('Arrow')) return;
  if (ev.ctrlKey || ev.altKey || ev.metaKey) return;
  // Cijfers via ev.code, zodat ze ook met Shift en op een AZERTY-toetsenbord werken
  const k = ev.key, digit = /^(?:Digit|Numpad)([0-9])$/.exec(ev.code);
  if (k === 'c' || k === 'C') toggleConcert();
  else if (k === ' ' || k === 'Enter') { if (!ev.repeat) strikeAll(); }
  else if (k === 'w' || k === 'W') toggleSing();
  else if (k === 's' || k === 'S') hush();
  else if (concert && digit) {
    // Concert: cijfer = die schaal aanslaan, Shift + cijfer = die schaal laten zingen of stoppen
    const i = concertSel[+digit[1] - 1];
    if (i === undefined) return;
    unlock();
    if (ev.shiftKey) rubs.has(i) ? stopRub(i) : startRub(i);
    else if (!ev.repeat) strike(i);
  }
  else if (concert) return;
  else if (k === 'ArrowLeft' || k === '<' || k === ',') go(-1);
  else if (k === 'ArrowRight' || k === '>' || k === '.') go(1);
  else if (digit) typeDigit(digit[1]);
  else return;
  ev.preventDefault();
});

// ---------- Liedjes uit Song Library (songs.js) ----------
// De schalen hebben vaste tonen; een liedje past als al zijn noten (na verschuiven) op hoogstens 8 schalen liggen.
const LIB = window.SONG_LIBRARY || null;
const bowlMidi = (b) => Math.round(69 + 12 * Math.log2(b.f / 440));
const PITCH = new Map();     // toonhoogte → schaal; bij twee schalen op dezelfde toon wint de eerste (Tibetaans boven Rose)
BOWLS.forEach((b, i) => { const m = bowlMidi(b); if (!PITCH.has(m)) PITCH.set(m, i); });
const noteMidi = (n) => { const m = n.match(/^([A-G])(#|b)?(\d)$/); return 12 * (+m[3] + 1) + { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); };
const SONGS = LIB ? LIB.songs.map(([id, cat, bpm, str]) => {
  const items = str.split(' ').map(tok => { const [n, d] = tok.split(':'); return { n, rest: n === 'R', beats: d ? +d : 1 }; });
  return { id, cat, bpm, items, notes: items.filter(x => !x.rest) };
}) : [];
function bowlsFor(sg) {
  const raw = sg.notes.map(x => noteMidi(x.n));
  for (let sh = -36; sh <= 12; sh++) {
    const idx = raw.map(m => PITCH.get(m + sh));
    if (idx.every(k => k !== undefined) && new Set(idx).size <= MAX_CONCERT) return idx;
  }
  return null;
}
const songState = { mode: 'idle', song: null, slots: [], pos: 0, misses: 0, timers: [] };
let songTarget = -1, songNext = -1;
const sEl = (id) => document.getElementById(id);
const songName = (id) => (LIB.names[lang] || {})[id] || LIB.names.en[id];
const sT = () => LANGS[lang].song;
function songStatus(text, cls) { sEl('songStatus').textContent = text; sEl('songStatus').className = cls || ''; }
function songMark() {
  const live = songState.mode !== 'idle';
  songTarget = live ? songState.slots[songState.pos] : -1;
  songNext = live && songState.mode === 'practice' ? songState.slots[songState.pos + 1] ?? -1 : -1;
}
function songButtons() {
  sEl('songListen').textContent = sT().listen;
  sEl('songPractice').textContent = sT().practice;
  sEl('songStop').title = sT().stop;
  sEl('songListen').classList.toggle('on', songState.mode === 'listen');
  sEl('songPractice').classList.toggle('on', songState.mode === 'practice');
}
function songStop(quiet) {
  songState.timers.forEach(clearTimeout); songState.timers = [];
  songState.mode = 'idle';
  songMark(); songButtons();
  if (!quiet) songStatus(sT().pick);
}
function songProgress() { songStatus(`${sT().note} ${Math.min(songState.pos + 1, songState.slots.length)} ${sT().of} ${songState.slots.length}`); }
// Zet het concert klaar met precies de schalen die het liedje nodig heeft
function songPrepare() {
  const sg = SONGS[+sEl('songSel').value], slots = sg && bowlsFor(sg);
  if (!slots) return false;
  Object.assign(songState, { song: sg, slots, pos: 0, misses: 0 });
  stopAllRubs();
  concertSel = [...new Set(slots)].sort((a, b) => bowlMidi(BOWLS[a]) - bowlMidi(BOWLS[b]));
  if (!concert) { concert = true; document.body.classList.add('concert'); store.set('mode', 'concert'); applyLang(); }
  renderChips();
  return true;
}
function songPractice() {
  unlock(); songStop(true);
  if (!songPrepare()) return;
  songState.mode = 'practice';
  songMark(); songButtons(); songProgress();
}
function songListen() {
  unlock(); songStop(true);
  if (!songPrepare()) return;
  songState.mode = 'listen';
  songMark(); songButtons(); songProgress();
  const beat = 60 / songState.song.bpm * 1000;
  let at = 300, k = 0;
  songState.song.items.forEach(x => {
    if (!x.rest) {
      const n = k++;
      songState.timers.push(setTimeout(() => { songState.pos = n; songMark(); songProgress(); strike(songState.slots[n], .5, .8); }, at));
    }
    at += x.beats * beat;
  });
  songState.timers.push(setTimeout(() => songStop(), at + 600));
}
function songHit(i) {
  if (songState.mode !== 'practice') return;
  if (i === songState.slots[songState.pos]) {
    songState.pos++;
    if (songState.pos >= songState.slots.length) {
      const m = songState.misses;
      songStop(true);
      songStatus(`${sT().done} ${m}`, 'good');
      return;
    }
    songMark(); songProgress();
  } else {
    songState.misses++;
    songStatus(sT().miss, 'bad');
  }
}
function songLabels() {
  if (!LIB) return;
  sEl('songBar').hidden = false;
  const sel = sEl('songSel'), v = sel.value || store.get('song', '');
  sel.innerHTML = '';
  LIB.cats.forEach(cat => {
    const g = document.createElement('optgroup');
    g.label = (LIB.catNames[lang] || LIB.catNames.en)[cat];
    SONGS.forEach((sg, i) => { if (sg.cat === cat && bowlsFor(sg)) g.appendChild(new Option('🎵 ' + songName(sg.id), i)); });
    if (g.children.length) sel.appendChild(g);
  });
  if (v !== '') sel.value = v;
  songButtons();
  if (songState.mode === 'idle') songStatus(sT().pick);
}
sEl('songSel').onchange = () => { store.set('song', sEl('songSel').value); songStop(); sEl('songSel').blur(); };
sEl('songListen').onclick = songListen;
sEl('songPractice').onclick = songPractice;
sEl('songStop').onclick = () => songStop();

window.addEventListener('resize', resize);
resize();
applyLang();
requestAnimationFrame(frame);

// Openen vanuit Song Library: index.html?song=<id>&mode=practice|listen
window.openSong = function (id, mode) {
  const i = SONGS.findIndex(sg => sg.id === id);
  if (i < 0) return;
  sEl('songSel').value = i;
  if (!bowlsFor(SONGS[i])) { songStatus(sT().nofit, 'bad'); return; }
  if (mode === 'listen') songListen(); else songPractice();
};
const wanted = new URLSearchParams(location.search);
if (wanted.get('song')) openSong(wanted.get('song'), wanted.get('mode'));
